<script>

         {"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":76,"s":[122,122,100]},
         {"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":153,"s":[128,128,100]},
         {"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":234,"s":[122,122,100]},

  "markers":[]
};

// ─── GYROBALL STATE ──────────────────────────────────────────────────────────
const ball = document.getElementById('gyroball');
const lottieEl = document.getElementById('lottie-container');
const erdeStatic = document.getElementById('erde-static');
const gyroBtn = document.getElementById('gyro-btn');

let ballX = 196, ballY = 400;
let ballSize = 140;
let velX = 0, velY = 0;
let gravX = 0, gravY = 0;
let hasGyro = false;
let isDragging = false;
let isPinching = false;
let pinchStartDist = 0, pinchStartSize = 140;

// Lottie instance
let anim = null;
let lottieReady = false;
let erdeHit = false;

function initLottie() {
  anim = lottie.loadAnimation({
    container: lottieEl,
    renderer: 'svg',
    loop: true,
    autoplay: false,
    animationData: LOTTIE_DATA
  });
  anim.addEventListener('data_ready', () => { lottieReady = true; });
}
initLottie();

// ─── TYPEWRITER ──────────────────────────────────────────────────────────────
const titleEl = document.getElementById('klima-title');
const subEl = document.getElementById('sub-title');
let titleDone = false;

function typewriter(el, text, speed, onDone) {
  let i = 0;
  const iv = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(iv); if (onDone) onDone(); }
  }, speed);
}

typewriter(titleEl, 'KLIMA', 80, () => {
  titleDone = true;
  subEl.style.opacity = '1';
  typewriter(subEl, 'EVERYTHING IS\nPOLITICAL', 40);
});

// ─── COLLISION ───────────────────────────────────────────────────────────────
function checkCollision() {
  const erdeLeft = 30, erdeTop = 280, erdeW = 320, erdeH = 310;
  const erdeCX = erdeLeft + erdeW / 2;
  const erdeCY = erdeTop + erdeH / 2;
  const dx = ballX - erdeCX;
  const dy = ballY - erdeCY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const hitRadius = ballSize / 2 + Math.min(erdeW, erdeH) / 2 * 0.35;
  const hit = dist < hitRadius;

  if (hit !== erdeHit) {
    erdeHit = hit;
    if (hit) {
      erdeStatic.style.opacity = '0';
      lottieEl.style.opacity = '1';
      if (lottieReady && anim) anim.play();
    } else {
      erdeStatic.style.opacity = '1';
      lottieEl.style.opacity = '0';
      if (anim) anim.stop();
    }
  }
}

// ─── RENDER BALL ─────────────────────────────────────────────────────────────
function renderBall() {
  const half = ballSize / 2;
  ball.style.left = (ballX - half) + 'px';
  ball.style.top  = (ballY - half) + 'px';
  ball.style.width  = ballSize + 'px';
  ball.style.height = ballSize + 'px';
}

// ─── PHYSICS LOOP ────────────────────────────────────────────────────────────
setInterval(() => {
  if (!hasGyro) return;
  const friction = 0.9, maxVel = 12;
  const half = ballSize / 2;
  const maxX = 393 - half, maxY = 852 - half;

  velX = Math.max(-maxVel, Math.min(maxVel, (velX + gravX) * friction));
  velY = Math.max(-maxVel, Math.min(maxVel, (velY + gravY) * friction));
  ballX = Math.max(half, Math.min(maxX, ballX + velX));
  ballY = Math.max(half, Math.min(maxY, ballY + velY));

  if (ballX <= half || ballX >= maxX) velX *= -0.4;
  if (ballY <= half || ballY >= maxY) velY *= -0.4;

  renderBall();
  checkCollision();
}, 16);

// ─── GYRO PERMISSION ─────────────────────────────────────────────────────────
gyroBtn.addEventListener('click', async () => {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result === 'granted') enableGyro();
    } catch(e) { enableGyro(); }
  } else {
    enableGyro();
  }
});

function enableGyro() {
  hasGyro = true;
  gyroBtn.style.display = 'none';
  window.addEventListener('deviceorientation', (e) => {
    gravX = (e.gamma || 0) * 0.06;
    gravY = ((e.beta  || 45) - 45) * 0.06;
  });
}

// ─── DRAG (fallback when no gyro) ────────────────────────────────────────────
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

ball.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    isPinching = true; isDragging = false;
    const t = e.touches;
    pinchStartDist = Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    pinchStartSize = ballSize;
  } else if (!hasGyro) {
    e.preventDefault();
    isDragging = true; isPinching = false;
  }
}, { passive: false });

ball.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const t = e.touches;
    const d = Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    ballSize = clamp(pinchStartSize * (d / pinchStartDist), 60, 280);
    renderBall(); checkCollision();
  } else if (e.touches.length === 1 && isDragging && !hasGyro) {
    e.preventDefault();
    const rect = document.getElementById('app').getBoundingClientRect();
    ballX = clamp(e.touches[0].clientX - rect.left, ballSize/2, 393 - ballSize/2);
    ballY = clamp(e.touches[0].clientY - rect.top,  ballSize/2, 852 - ballSize/2);
    renderBall(); checkCollision();
  }
}, { passive: false });

ball.addEventListener('touchend', () => { isDragging = false; isPinching = false; });

// Mouse drag (desktop testing)
ball.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
document.addEventListener('mousemove', (e) => {
  if (!isDragging || hasGyro) return;
  const rect = document.getElementById('app').getBoundingClientRect();
  ballX = clamp(e.clientX - rect.left, ballSize/2, 393 - ballSize/2);
  ballY = clamp(e.clientY - rect.top,  ballSize/2, 852 - ballSize/2);
  renderBall(); checkCollision();
});
document.addEventListener('mouseup', () => { isDragging = false; });

// Initial render
renderBall();
</script>
