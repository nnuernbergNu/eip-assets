function useTypewriter(text, active, speed = 40) {
  const [displayed, setDisplayed] = useState("");
  useEffect(() => {
    if (!active) {
      setDisplayed("");
      return;
    }
    let i = 0;
    const interval = setInterval(() => {
      setDisplayed(text.slice(0, i + 1));
      i++;
      if (i >= text.length) clearInterval(interval);
    }, speed);
    return () => clearInterval(interval);
  }, [active, text]);
  return displayed;
}
function useGyroball() {
  const [pos, setPos] = useState({
    x: 196,
    y: 400
  });
  const [ballSize, setBallSize] = useState(140);
  const [hasPermission, setHasPermission] = useState(false);
  const dragging = useRef(false);
  const pinching = useRef(false);
  const pinchStartDist = useRef(0);
  const pinchStartSize = useRef(140);
  const vel = useRef({
    x: 0,
    y: 0
  });
  const posRef = useRef({
    x: 196,
    y: 400
  });
  const ballSizeRef = useRef(140);
  const gravity = useRef({
    x: 0,
    y: 0
  });
  const requestPermission = async () => {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      try {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result === "granted") setHasPermission(true);
      } catch (e) {
        setHasPermission(true);
      }
    } else {
      setHasPermission(true);
    }
  };
  const handleDrag = (x, y) => {
    const r = ballSizeRef.current / 2;
    const nx = Math.max(r, Math.min(393 - r, x));
    const ny = Math.max(r, Math.min(852 - r, y));
    posRef.current = {
      x: nx,
      y: ny
    };
    vel.current = {
      x: 0,
      y: 0
    };
    setPos({
      x: nx,
      y: ny
    });
  };
  const updateSize = newSize => {
    const clamped = Math.max(60, Math.min(280, newSize));
    ballSizeRef.current = clamped;
    setBallSize(clamped);
  };
  useEffect(() => {
    if (!hasPermission) return;
    const handleOrientation = e => {
      gravity.current.x = (e.gamma || 0) * 0.06;
      gravity.current.y = ((e.beta || 45) - 45) * 0.06;
    };
    window.addEventListener("deviceorientation", handleOrientation);
    const tick = setInterval(() => {
      const friction = 0.9;
      const maxVel = 12;
      const r = ballSizeRef.current / 2;
      const maxX = 393 - r;
      const maxY = 852 - r;
      vel.current.x = Math.max(-maxVel, Math.min(maxVel, (vel.current.x + gravity.current.x) * friction));
      vel.current.y = Math.max(-maxVel, Math.min(maxVel, (vel.current.y + gravity.current.y) * friction));
      posRef.current.x = Math.max(r, Math.min(maxX, posRef.current.x + vel.current.x));
      posRef.current.y = Math.max(r, Math.min(maxY, posRef.current.y + vel.current.y));
      if (posRef.current.x <= r || posRef.current.x >= maxX) vel.current.x *= -0.4;
      if (posRef.current.y <= r || posRef.current.y >= maxY) vel.current.y *= -0.4;
