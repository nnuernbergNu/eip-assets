<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1C1C1C;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    touch-action: none;
  }
  #app {
    position: relative;
    width: 393px;
    height: 852px;
    background: #F5F0E8;
    overflow: hidden;
    /* Scale to fit viewport on any screen */
    transform-origin: center center;
  }
  #lottie-container {
    position: absolute;
    left: 30px; top: 280px;
    width: 320px; height: 310px;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #erde-static {
    position: absolute;
    left: 30px; top: 280px;
    width: 320px; height: 310px;
    z-index: 4;
    object-fit: contain;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.2s;
  }
  #gyroball {
    position: absolute;
    border-radius: 50%;
    background: #DCFF89;
    mix-blend-mode: exclusion;
    z-index: 20;
    touch-action: none;
    cursor: grab;
  }
  #gyro-btn {
    position: absolute;
    bottom: 90px; right: 24px;
    background: #1C1C1C;
    color: #DCFF89;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 20px;
    cursor: pointer;
    z-index: 30;
    border: none;
    user-select: none;
  }
  /* Hamburger Menu */
  #hamburger {
    position: absolute;
    top: 24px; right: 24px;
    z-index: 50;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 4px;
  }
  #hamburger span {
    display: block;
    width: 28px; height: 3px;
    background: #DCFF89;
  }
  #menu-overlay {
    position: absolute;
    inset: 0;
    z-index: 49;
    display: none;
  }
  #menu-panel {
    position: absolute;
    top: 0; right: 0;
    width: 244px; height: 852px;
    background: #1C1C1C;
    z-index: 50;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }
  #menu-panel.open {
    transform: translateX(0);
  }
  #menu-overlay.open {
    display: block;
  }
  .menu-item {
    color: #DCFF89;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .menu-topics {
    display: flex;
    flex-direction: row;
    gap: 20px;
    margin-top: 8px;
    align-items: flex-start;
  }
  .menu-topic {
    color: #F5F0E8;
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800;
    text-transform: uppercase;
    cursor: pointer;
    letter-spacing: 0.03em;
    writing-mode: vertical-rl;

  <!-- Gyro button -->

  <!-- WAS IST DAS -->
  <svg style="position:absolute;bottom:24px;right:24px;width:140px;height:70px;z-index:30;overflow:visible;">
    <rect x="0" y="7" width="140" height="40" fill="#1C1C1C"/>
    <polygon points="126,47 97.26,47 49.37,70" fill="#1C1C1C"/>
    <text x="70" y="27" text-anchor="middle" dominant-baseline="middle" fill="#DCFF89" font-family="'DM Sans',sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">WAS IST DAS?</text>
  </svg>

  <!-- Hamburger -->
  <div id="hamburger">
    <span></span><span></span><span></span>
  </div>

  <!-- Menu overlay (closes on tap outside) -->
  <div id="menu-overlay"></div>

  <!-- Menu panel -->
  <div id="menu-panel">
    <div class="menu-item" id="menu-close">✕ SCHLIESSEN</div>
    <div class="menu-topics">
      <div class="menu-topic">BILDUNG</div>
      <div class="menu-topic">GLEICHBERECHTIGUNG</div>
      <div class="menu-topic active">KLIMA</div>
    </div>
  </div>

</div>

<script>
// ─── SCALE TO FIT ─────────────────────────────────────────────────────────────
function scaleApp() {
  const app = document.getElementById('app');
  const scaleX = window.innerWidth / 393;
  const scaleY = window.innerHeight / 852;
  const scale = Math.min(scaleX, scaleY);
  app.style.transform = `scale(${scale})`;
}
scaleApp();
window.addEventListener('resize', scaleApp);

// ─── HAMBURGER MENU ──────────────────────────────────────────────────────────
const hamburger = document.getElementById('hamburger');
const menuPanel = document.getElementById('menu-panel');
const menuOverlay = document.getElementById('menu-overlay');
const menuClose = document.getElementById('menu-close');

function openMenu() {
  menuPanel.classList.add('open');
  menuOverlay.classList.add('open');
}
function closeMenu() {
  menuPanel.classList.remove('open');
  menuOverlay.classList.remove('open');
}

hamburger.addEventListener('click', openMenu);
menuClose.addEventListener('click', closeMenu);
menuOverlay.addEventListener('click', closeMenu);

// ─── LOTTIE DATA (Bilder von GitHub raw) ────────────────────────────────────
const BASE = 'https://raw.githubusercontent.com/nnuernbergNu/eip-assets/main/images/';
const LOTTIE_DATA = {

       {"i":{"x":0.667,"y":1},"o":{"x":0.333,"y":0},"t":155,"s":[500,500,-2666.667],"to":[0,0,0],"ti":[0,0,-14]},

       "rz":{"a":1,"k":[
         {"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":0,"s":[-9]},
         {"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":61,"s":[-16]},
         {"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":143,"s":[-11]},

     "ks":{"o":{"a":0,"k":100,"ix":11},"rx":{"a":0,"k":0,"ix":8},"ry":{"a":0,"k":0,"ix":9},
       "rz":{"a":1,"k":[
         {"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":0,"s":[0]},
         {"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":95,"s":[9]},
         {"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":192,"s":[4]},

    {"ddd":1,"ind":5,"ty":2,"nm":"layer2","refId":"image_2","sr":1,
     "ks":{"o":{"a":0,"k":100,"ix":11},"rx":{"a":0,"k":0,"ix":8},"ry":{"a":0,"k":0,"ix":9},
       "rz":{"a":1,"k":[
         {"i":{"x":[0.667],"y":[1]},"o":{"x":[0.333],"y":[0]},"t":0,"s":[0]},

       ],"ix":10},
       "or":{"a":0,"k":[0,0,0],"ix":7},"p":{"a":0,"k":[502,498,0],"ix":2},

         {"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":0,"s":[128,128,100]},
         {"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":76,"s":[122,122,100]},
         {"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":153,"s":[128,128,100]},
         {"i":{"x":[0.667,0.667,0.667],"y":[1,1,1]},"o":{"x":[0.333,0.333,0.333],"y":[0,0,0]},"t":234,"s":[122,122,100]},
         {"t":315,"s":[128,128,100]}
       ],"ix":6}},
     "ao":0,"ip":0,"op":324,"st":0,"bm":0}
  ],
  "markers":[]
};

// ─── GYROBALL ────────────────────────────────────────────────────────────────
const ball = document.getElementById('gyroball');
const lottieEl = document.getElementById('lottie-container');
const erdeStatic = document.getElementById('erde-static');
const gyroBtn = document.getElementById('gyro-btn');

let ballX = 196, ballY = 400, ballSize = 140;
let velX = 0, velY = 0, gravX = 0, gravY = 0;
let hasGyro = false, isDragging = false, isPinching = false;
let pinchStartDist = 0, pinchStartSize = 140;
let anim = null, lottieReady = false, erdeHit = false;

// Init Lottie
anim = lottie.loadAnimation({
  container: lottieEl,
  renderer: 'svg',
  loop: true,
  autoplay: false,
  animationData: LOTTIE_DATA
});
anim.addEventListener('data_ready', () => { lottieReady = true; });

// Typewriter
const titleEl = document.getElementById('klima-title');
const subEl = document.getElementById('sub-title');
function typewriter(el, text, speed, onDone) {
  let i = 0;
  const iv = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(iv); if (onDone) onDone(); }
  }, speed);
}
typewriter(titleEl, 'KLIMA', 80, () => {
  subEl.style.opacity = '1';
  typewriter(subEl, 'EVERYTHING IS\nPOLITICAL', 40);
});

// Collision
function checkCollision() {
  const erdeCX = 30 + 160, erdeCY = 280 + 155;
  const dx = ballX - erdeCX, dy = ballY - erdeCY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const hitRadius = ballSize / 2 + 110 * 0.35;
  const hit = dist < hitRadius;
  if (hit !== erdeHit) {
    erdeHit = hit;
    erdeStatic.style.opacity = hit ? '0' : '1';
    lottieEl.style.opacity = hit ? '1' : '0';
    if (hit) { if (lottieReady && anim) anim.play(); }
    else { if (anim) anim.stop(); }
  }
}

// Render
function renderBall() {
  const h = ballSize / 2;
  ball.style.left = (ballX - h) + 'px';
  ball.style.top  = (ballY - h) + 'px';
  ball.style.width = ball.style.height = ballSize + 'px';
}

// Physics
setInterval(() => {
  if (!hasGyro) return;
  const f = 0.9, max = 12, h = ballSize / 2;
  velX = Math.max(-max, Math.min(max, (velX + gravX) * f));
  velY = Math.max(-max, Math.min(max, (velY + gravY) * f));
  ballX = Math.max(h, Math.min(393 - h, ballX + velX));
  ballY = Math.max(h, Math.min(852 - h, ballY + velY));
  if (ballX <= h || ballX >= 393-h) velX *= -0.4;
  if (ballY <= h || ballY >= 852-h) velY *= -0.4;
  renderBall(); checkCollision();
}, 16);

// Gyro permission
gyroBtn.addEventListener('click', async () => {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r === 'granted') enableGyro();
    } catch(e) { enableGyro(); }
  } else { enableGyro(); }
});
function enableGyro() {
  hasGyro = true;
  gyroBtn.style.display = 'none';
  window.addEventListener('deviceorientation', (e) => {
    gravX = (e.gamma || 0) * 0.06;
    gravY = ((e.beta || 45) - 45) * 0.06;
  });
}

// Touch / drag
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

ball.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault(); isPinching = true; isDragging = false;
    const t = e.touches;
    pinchStartDist = Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    pinchStartSize = ballSize;
  } else if (!hasGyro) { e.preventDefault(); isDragging = true; isPinching = false; }
}, { passive: false });

ball.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    ballSize = clamp(pinchStartSize * (d / pinchStartDist), 60, 280);
    renderBall(); checkCollision();
  } else if (e.touches.length === 1 && isDragging && !hasGyro) {
    e.preventDefault();
    const rect = document.getElementById('app').getBoundingClientRect();
    const scale = rect.width / 393;
    ballX = clamp((e.touches[0].clientX - rect.left) / scale, ballSize/2, 393 - ballSize/2);
    ballY = clamp((e.touches[0].clientY - rect.top) / scale, ballSize/2, 852 - ballSize/2);
    renderBall(); checkCollision();
  }
}, { passive: false });

ball.addEventListener('touchend', () => { isDragging = isPinching = false; });

// Mouse (desktop)
ball.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
document.addEventListener('mousemove', (e) => {
  if (!isDragging || hasGyro) return;
  const rect = document.getElementById('app').getBoundingClientRect();
  const scale = rect.width / 393;
  ballX = clamp((e.clientX - rect.left) / scale, ballSize/2, 393 - ballSize/2);
  ballY = clamp((e.clientY - rect.top) / scale, ballSize/2, 852 - ballSize/2);
  renderBall(); checkCollision();
});
document.addEventListener('mouseup', () => { isDragging = false; });

renderBall();
</script>

</html>
